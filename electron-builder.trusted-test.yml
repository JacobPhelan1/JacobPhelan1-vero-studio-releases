appId: com.verobroadcasting.verostudio
productName: VERO Studio
asar: true
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/VERO-Studio.ico
  artifactName: VERO-Studio-Setup-${version}.${ext}
  signtoolOptions:
    certificateSubjectName: VERO Broadcasting LLC
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VERO Studio
  installerIcon: build/VERO-Studio.ico
  uninstallerIcon: build/VERO-Studio.ico
publish: null
