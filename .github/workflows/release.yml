name: Publish VERO Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run desktop:icon
      - name: Build installer and update metadata
        run: npx electron-builder --win nsis --publish never
      - name: Verify update artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/VERO-Studio-Setup-*.exe | Select-Object -First 1
          $blockmap = Get-ChildItem release/VERO-Studio-Setup-*.exe.blockmap | Select-Object -First 1
          $metadata = Get-Item release/latest.yml -ErrorAction SilentlyContinue
          if (-not $installer -or -not $blockmap -or -not $metadata) {
            Get-ChildItem release | Format-Table Name, Length
            throw "Release is incomplete. Installer, blockmap, and latest.yml are required."
          }
      - name: Publish complete update feed
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/VERO-Studio-Setup-*.exe
            release/VERO-Studio-Setup-*.exe.blockmap
            release/latest.yml
